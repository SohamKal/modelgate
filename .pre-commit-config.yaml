repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --check
        language: system
        types: [python]
      - id: detect-secrets
        name: detect secrets
        entry: uv run --no-sync detect-secrets-hook -n
        language: system
        types: [text]
