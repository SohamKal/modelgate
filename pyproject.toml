[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modelgate"
version = "0.0.0"
description = "Provider-neutral LLM gateway and shadow evaluation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0,<1",
    "opentelemetry-sdk>=1.27,<2",
    "prometheus-client>=0.20,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5,<2",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.7,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
