services:
  gateway:
    build: .
    environment:
      MODELGATE_CLIENT_API_KEY: ${MODELGATE_CLIENT_API_KEY:?Copy .env.example to .env and configure a gateway key}
      MODELGATE_STABLE_RELEASE: ${MODELGATE_STABLE_RELEASE:-fake}
      MODELGATE_VERIFICATION_PROVIDER: ${MODELGATE_VERIFICATION_PROVIDER:-groq}
      MODELGATE_MAX_REQUEST_BYTES: ${MODELGATE_MAX_REQUEST_BYTES:-65536}
      MODELGATE_MAX_OUTPUT_TOKENS: ${MODELGATE_MAX_OUTPUT_TOKENS:-1024}
      MODELGATE_SERVING_DEADLINE_SECONDS: ${MODELGATE_SERVING_DEADLINE_SECONDS:-10}
      MODELGATE_SERVING_CONCURRENCY: ${MODELGATE_SERVING_CONCURRENCY:-20}
      MODELGATE_CONTENT_HASH_KEY: ${MODELGATE_CONTENT_HASH_KEY:?Configure a content hash key in .env}
      MODELGATE_DATABASE_DEADLINE_SECONDS: ${MODELGATE_DATABASE_DEADLINE_SECONDS:-1}
      MODELGATE_SHADOW_PAYLOAD_BYTES: ${MODELGATE_SHADOW_PAYLOAD_BYTES:-131072}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_A: ${OPENAI_MODEL_A:-}
      OPENAI_MODEL_B: ${OPENAI_MODEL_B:-}
      MODELGATE_OPENAI_A_SUPPORTS_TEMPERATURE: ${MODELGATE_OPENAI_A_SUPPORTS_TEMPERATURE:-false}
      MODELGATE_OPENAI_B_SUPPORTS_TEMPERATURE: ${MODELGATE_OPENAI_B_SUPPORTS_TEMPERATURE:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_A: ${GROQ_MODEL_A:-openai/gpt-oss-20b}
      GROQ_MODEL_B: ${GROQ_MODEL_B:-openai/gpt-oss-120b}
      MODELGATE_GROQ_A_SUPPORTS_TEMPERATURE: ${MODELGATE_GROQ_A_SUPPORTS_TEMPERATURE:-false}
      MODELGATE_GROQ_B_SUPPORTS_TEMPERATURE: ${MODELGATE_GROQ_B_SUPPORTS_TEMPERATURE:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-modelgate}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-modelgate}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modelgate}
      POSTGRES_USER: ${POSTGRES_USER:-modelgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:${MODELGATE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [observability]
    ports:
      - "127.0.0.1:4317:4317"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-dev-only}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  postgres_data:
