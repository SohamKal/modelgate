name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Types
        run: uv run --no-sync mypy app worker
      - name: Tests
        run: uv run --no-sync pytest
      - name: Secret scan
        run: uv run --no-sync pre-commit run detect-secrets --all-files
      - name: Dependency audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/modelgate-requirements.txt
          uv run --no-sync pip-audit -r /tmp/modelgate-requirements.txt
